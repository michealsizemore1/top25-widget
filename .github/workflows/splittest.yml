name: BeyondStride split test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BeyondStride-PHONE.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk BeyondStride-WATCH.apk

      - uses: actions/upload-artifact@v4
        with:
          name: beyondstride-test
          path: |
            BeyondStride-PHONE.apk
            BeyondStride-WATCH.apk
