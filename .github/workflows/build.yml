name: Build widget APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon

      - name: Workout plan parser checks
        run: gradle :app:testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Top25Widget.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk Top25Watch.apk

      # Publishes the APK as a GitHub Release so you can download it straight from your phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Top 25 Widget (build ${{ github.run_number }})
          files: |
            Top25Widget.apk
            Top25Watch.apk
          make_latest: true
